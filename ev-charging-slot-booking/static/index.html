<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ EV Charging Slot Booking</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ── NAV ──────────────────────────────────────────────────── -->
  <header class="navbar">
    <div class="nav-brand">
      <span class="bolt">⚡</span>
      <span>EV<strong>Charge</strong></span>
    </div>
    <nav class="nav-links">
      <a href="#stations" class="nav-btn">Find a Charger</a>
      <a href="#booking"  class="nav-btn active">Book a Slot</a>
      <a href="#my-bookings" class="nav-btn">My Bookings</a>
    </nav>
  </header>

  <!-- ── HERO ─────────────────────────────────────────────────── -->
  <section class="hero">
    <div class="hero-content">
      <h1>Charge Smarter,<br>Drive Farther</h1>
      <p>Find and book EV charging slots near you — instantly.</p>
      <a href="#stations" class="btn-primary">Find Stations ↓</a>
    </div>
    <div class="hero-graphic">
      <div class="ev-icon">🔋</div>
      <div class="pulse-ring"></div>
    </div>
  </section>

  <!-- ── STATIONS ─────────────────────────────────────────────── -->
  <section id="stations" class="section">
    <div class="section-header">
      <h2>⚡ Find a Charger</h2>
      <button class="btn-refresh" onclick="loadStations()">↻ Refresh</button>
    </div>
    <div id="station-grid" class="station-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </section>

  <!-- ── BOOKING FORM ──────────────────────────────────────────── -->
  <section id="booking" class="section section-dark">
    <div class="section-header">
      <h2>📅 Book a Slot</h2>
    </div>
    <div class="form-card">
      <form id="booking-form" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="user_name">👤 Full Name</label>
            <input id="user_name" type="text" placeholder="e.g. Priya Sharma" required />
          </div>
          <div class="form-group">
            <label for="vehicle_number">🚘 Vehicle Number</label>
            <input id="vehicle_number" type="text" placeholder="e.g. KA-01-AB-1234" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="station_select">⚡ Select Station</label>
            <select id="station_select" required>
              <option value="">— Choose a station —</option>
            </select>
          </div>
          <div class="form-group">
            <label for="time_slot">🕐 Time Slot</label>
            <select id="time_slot" required>
              <option value="">— Choose a time —</option>
              <option>08:00 AM – 09:00 AM</option>
              <option>09:00 AM – 10:00 AM</option>
              <option>10:00 AM – 11:00 AM</option>
              <option>11:00 AM – 12:00 PM</option>
              <option>12:00 PM – 01:00 PM</option>
              <option>01:00 PM – 02:00 PM</option>
              <option>02:00 PM – 03:00 PM</option>
              <option>03:00 PM – 04:00 PM</option>
              <option>04:00 PM – 05:00 PM</option>
              <option>05:00 PM – 06:00 PM</option>
              <option>06:00 PM – 07:00 PM</option>
              <option>07:00 PM – 08:00 PM</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-submit">
          <span class="btn-text">⚡ Confirm Booking</span>
          <span class="btn-spinner hidden">⏳</span>
        </button>
      </form>

      <!-- Toast notification -->
      <div id="toast" class="toast hidden"></div>
    </div>
  </section>

  <!-- ── BOOKINGS TABLE ────────────────────────────────────────── -->
  <section id="my-bookings" class="section">
    <div class="section-header">
      <h2>📋 All Active Bookings</h2>
      <button class="btn-refresh" onclick="loadBookings()">↻ Refresh</button>
    </div>
    <div id="bookings-container">
      <p class="placeholder-text">Loading bookings…</p>
    </div>
  </section>

  <!-- ── FOOTER ────────────────────────────────────────────────── -->
  <footer class="footer">
    <p>⚡ EVCharge Booking System &nbsp;|&nbsp; Built with Flask + SQLite + Vanilla JS</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
